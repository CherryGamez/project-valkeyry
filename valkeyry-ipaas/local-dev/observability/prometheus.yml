global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'valkeyry-ipaas'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: valkeyry-ipaas

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          service: rabbitmq
