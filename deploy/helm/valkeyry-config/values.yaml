## Default values for valkeyry-config.

replicaCount: 2

image:
  repository: ghcr.io/your-org/valkeyry-config
  tag: 1.0.0-SNAPSHOT
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: config.valkeyry.example.com
      paths: [{ path: /, pathType: Prefix }]
  tls: []

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits:   { cpu: 1500m, memory: 1Gi }

## Postgres connection
postgres:
  r2dbcUrl: "r2dbc:postgresql://postgres:5432/valkeyry_config"
  jdbcUrl:  "jdbc:postgresql://postgres:5432/valkeyry_config"
  user:     "valkeyry"
  ## In production override via --set-string or secret-store CSI driver.
  password: "valkeyry"

oidc:
  issuerUri: "https://oidc.example.com/realms/valkeyry"

ldap:
  url:          "ldap://openldap:389"
  baseDn:       "dc=valkeyry,dc=io"
  userDn:       "uid={0},ou=people,dc=valkeyry,dc=io"
  managerDn:    "cn=admin,dc=valkeyry,dc=io"
  managerPass:  ""
  tenantAttr:   "ou"

apiKeys:
  ## Format: "key:tenantA,tenantB;key2:tenantC".  Leave blank to disable.
  table: ""

## Outbound audit-log fan-out (SIEM, Splunk, Datadog Logs, …)
auditWebhook:
  enabled: false
  ## comma-separated list of URLs
  urls: ""
  ## HMAC-SHA256 shared secret. Leave blank → signature header carries "sha256=unsigned"
  secret: ""
  timeoutMs: 5000
  maxRetries: 3
  initialBackoffMs: 200

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities: { drop: ["ALL"] }

nodeSelector: {}
tolerations: []
affinity: {}
