# Test profile: switches the embedded mock-oauth2-server in via DynamicPropertySource.
spring:
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
valkeyry:
  api-keys:
    table: ${VALKEYRY_TEST_API_KEYS:plugin-test-key:demo-tenant}
logging:
  level:
    io.valkeyry: DEBUG
    org.springframework.security: DEBUG
