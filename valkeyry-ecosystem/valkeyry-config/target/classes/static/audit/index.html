<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Valkeyry · Audit</title>

    <!-- React 18 + Babel standalone (zero-build) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CDN (zero-config) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            /*
             * Slate + Emerald palette (dark theme).
             * Namespace kept as `ios.*` so existing JSX classNames don't have to change —
             * the values were re-mapped from iOS hues to Slate-900 + Emerald-500 brand.
             */
            colors: {
              ios: {
                bg:      '#0F172A',          // slate-900 (page background)
                card:    '#1E293B',          // slate-800 (elevated surface)
                surface: '#0B1220',          // slate-950 (input wells)
                ink:     '#F1F5F9',          // slate-100 (primary text)
                ink2:    '#CBD5E1',          // slate-300 (secondary text)
                muted:   '#94A3B8',          // slate-400
                line:    '#334155',          // slate-700 (borders)
                blue:    '#10B981',          // emerald-500 (primary brand action)
                indigo:  '#6366F1',          // indigo-500
                purple:  '#A855F7',          // purple-500
                pink:    '#EC4899',          // pink-500
                red:     '#F43F5E',          // rose-500 (destructive / removed)
                orange:  '#F59E0B',          // amber-500 (warning / syncing)
                yellow:  '#EAB308',          // yellow-500
                green:   '#10B981',          // emerald-500 (success / added)
                mint:    '#14B8A6',          // teal-500
                teal:    '#06B6D4',          // cyan-500
              }
            },
            fontFamily: {
              sans: ['"Inter"', '"SF Pro Display"', '-apple-system', 'BlinkMacSystemFont',
                     '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', '"SF Mono"', 'ui-monospace', 'Menlo', 'Monaco', 'monospace'],
            },
            boxShadow: {
              ios:    '0 1px 2px rgba(2,6,23,0.40), 0 6px 18px rgba(2,6,23,0.30)',
              'ios-lg':'0 4px 8px rgba(2,6,23,0.35), 0 18px 40px rgba(2,6,23,0.50)',
              'ios-inner': 'inset 0 0 0 1px rgba(148,163,184,0.10)',
            },
            borderRadius: { ios: '14px', 'ios-lg':'20px', 'ios-xl':'28px' }
          }
        }
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

    <style>
      html, body, #root { background:#0F172A; color:#F1F5F9; min-height:100%; }
      body { font-family:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif; letter-spacing:-0.011em; }
      ::selection { background:#10B981; color:#0F172A; }
      /* Slate scrollbar */
      .scrollbar::-webkit-scrollbar { height:8px; width:8px; }
      .scrollbar::-webkit-scrollbar-thumb { background:#475569; border-radius:4px; }
      .scrollbar::-webkit-scrollbar-thumb:hover { background:#64748B; }

      /* Spring micro-interactions (kept iOS-class names for backwards-compat) */
      .ios-lift   { transition: transform 180ms cubic-bezier(.34,1.56,.64,1), box-shadow 180ms ease; }
      .ios-lift:hover { transform: translateY(-1px); box-shadow:0 4px 8px rgba(2,6,23,0.35), 0 18px 40px rgba(16,185,129,0.10); }
      .ios-press  { transition: transform 120ms ease, background-color 120ms ease, color 120ms ease; }
      .ios-press:active { transform: scale(.97); }

      /* Segmented control */
      .segmented { background:#0B1220; padding:2px; border-radius:9px; display:inline-flex; box-shadow: inset 0 0 0 1px rgba(148,163,184,0.10); }
      .segmented button { padding:6px 14px; border-radius:7px; font-size:13px; font-weight:500; color:#CBD5E1; transition:background 160ms ease, color 160ms ease, box-shadow 160ms ease; }
      .segmented button[data-active="true"] { background:#10B981; color:#0F172A; box-shadow:0 1px 2px rgba(2,6,23,0.30), 0 2px 8px rgba(16,185,129,0.30); }

      /* Switch */
      .ios-switch { width:42px; height:26px; background:#334155; border-radius:13px; position:relative; transition:background 200ms ease; cursor:pointer; flex-shrink:0; }
      .ios-switch[data-on="true"] { background:#10B981; }
      .ios-switch::after { content:''; width:22px; height:22px; background:#F1F5F9; border-radius:50%; position:absolute; top:2px; left:2px; box-shadow:0 2px 4px rgba(2,6,23,0.50); transition:left 200ms cubic-bezier(.34,1.56,.64,1); }
      .ios-switch[data-on="true"]::after { left:18px; }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useEffect, useMemo, useState, useCallback, useRef } = React;

// ---------- helpers ----------
function loadAuth() { return { tenantId: localStorage.getItem('vk.tenant')||'', mode: localStorage.getItem('vk.auth.mode')||'bearer', token: localStorage.getItem('vk.auth.token')||'' }; }
function saveAuth(n) { localStorage.setItem('vk.tenant', n.tenantId); localStorage.setItem('vk.auth.mode', n.mode); localStorage.setItem('vk.auth.token', n.token); }
function authHeaders(a) { if (!a.token) return {}; return a.mode==='bearer' ? { Authorization:`Bearer ${a.token}` } : { 'X-API-Key': a.token }; }

function diffJson(b, a) { const o=[]; walk('', b, a, o, 0); return o; }
function walk(p, b, a, out, d) {
    if (deepEqual(b,a)) { out.push({kind:'equal', path:p, depth:d, value:b}); return; }
    const bo=isObj(b), ao=isObj(a);
    if (bo && ao) {
        const keys = Array.from(new Set([...Object.keys(b||{}), ...Object.keys(a||{})])).sort();
        out.push({kind:'open', path:p, depth:d, value:'{'});
        keys.forEach(k=>walk(p?`${p}.${k}`:k, b?.[k], a?.[k], out, d+1));
        out.push({kind:'close', path:p, depth:d, value:'}'});
        return;
    }
    if (Array.isArray(b) && Array.isArray(a)) {
        const n = Math.max(b.length, a.length);
        out.push({kind:'open', path:p, depth:d, value:'['});
        for (let i=0;i<n;i++) walk(`${p}[${i}]`, b[i], a[i], out, d+1);
        out.push({kind:'close', path:p, depth:d, value:']'});
        return;
    }
    if (b===undefined) out.push({kind:'add', path:p, depth:d, after:a});
    else if (a===undefined) out.push({kind:'remove', path:p, depth:d, before:b});
    else out.push({kind:'change', path:p, depth:d, before:b, after:a});
}
function deepEqual(x,y){ if (x===y) return true; if (typeof x!==typeof y) return false; if (x===null||y===null) return x===y; if (Array.isArray(x)&&Array.isArray(y)) return x.length===y.length && x.every((v,i)=>deepEqual(v,y[i])); if (typeof x==='object') { const k=Object.keys(x), j=Object.keys(y); return k.length===j.length && k.every(key=>deepEqual(x[key],y[key])); } return false; }
function isObj(v){ return v && typeof v==='object' && !Array.isArray(v); }
function pretty(v){ return v===undefined?'undefined':JSON.stringify(v,null,2); }
function leaf(p){ if (!p) return ''; const d=p.lastIndexOf('.'); return d===-1?p:p.slice(d+1); }

// ---------- Slate palette per op / track (dark-theme) ----------
const OP_BADGE = {
    DECLARE_TABLE: { bg:'#1E3A8A', fg:'#93C5FD', label:'Declared' },   // blue-900 / blue-300
    REVISE_TABLE:  { bg:'#78350F', fg:'#FCD34D', label:'Revised'  },   // amber-900 / amber-300
    INGEST_RECORD: { bg:'#064E3B', fg:'#6EE7B7', label:'Ingested' },   // emerald-900 / emerald-300
    DEDUP_SKIP:    { bg:'#334155', fg:'#CBD5E1', label:'Deduped'  },   // slate-700 / slate-300
};
const TRACK_BADGE = {
    OIDC:      { bg:'#312E81', fg:'#A5B4FC' },   // indigo-900 / indigo-300
    LDAP:      { bg:'#155E75', fg:'#67E8F9' },   // cyan-900 / cyan-300
    API_KEY:   { bg:'#78350F', fg:'#FCD34D' },   // amber-900 / amber-300
    ANONYMOUS: { bg:'#7F1D1D', fg:'#FCA5A5' },   // red-900 / red-300
};

// ---------- App ----------
function App() {
    const [auth, setAuth] = useState(loadAuth());
    const [filters, setFilters] = useState({ tableName:'', recordKey:'', actor:'', limit:50, offset:0 });
    const [rows, setRows] = useState([]);
    const [status, setStatus] = useState({ loading:false, error:null, lastFetched:null });
    const [autoRefresh, setAutoRefresh] = useState(false);

    const fetcher = useCallback(async () => {
        if (!auth.tenantId) { setStatus(s=>({ ...s, error:'Tenant id required' })); return; }
        if (!auth.token)    { setStatus(s=>({ ...s, error:'Token / API key required' })); return; }
        setStatus({ loading:true, error:null, lastFetched: status.lastFetched });
        const url = new URL(`/api/v1/tenants/${encodeURIComponent(auth.tenantId)}/audit`, location.origin);
        if (filters.tableName) url.searchParams.set('tableName', filters.tableName);
        if (filters.recordKey) url.searchParams.set('recordKey', filters.recordKey);
        if (filters.actor)     url.searchParams.set('actor',     filters.actor);
        url.searchParams.set('limit',  String(filters.limit));
        url.searchParams.set('offset', String(filters.offset));
        try {
            const r = await fetch(url, { headers: { Accept:'application/json', ...authHeaders(auth) } });
            if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
            const data = await r.json();
            setRows(Array.isArray(data) ? data : []);
            setStatus({ loading:false, error:null, lastFetched:new Date() });
        } catch (e) {
            setStatus({ loading:false, error:String(e.message || e), lastFetched:status.lastFetched });
        }
    }, [auth, filters]);

    const intervalRef = useRef(null);
    useEffect(() => {
        clearInterval(intervalRef.current);
        if (autoRefresh) intervalRef.current = setInterval(fetcher, 5000);
        return () => clearInterval(intervalRef.current);
    }, [autoRefresh, fetcher]);

    return (
        <div className="min-h-screen flex flex-col">
            <Header status={status}/>
            <main className="max-w-[1280px] w-full mx-auto px-5 lg:px-8 py-7 grid gap-5">
                <AuthCard auth={auth} onConnect={n => { setAuth(n); saveAuth(n); }}/>
                <FilterCard filters={filters} setFilters={setFilters} onApply={fetcher} busy={status.loading}
                            autoRefresh={autoRefresh} setAutoRefresh={setAutoRefresh}/>
                {status.error && (
                    <div data-testid="audit-error" className="bg-white rounded-ios-lg p-4 ios-shadow-sm flex items-center gap-3 border-l-4 border-ios-red">
                        <span className="w-6 h-6 rounded-full bg-ios-red text-ios-bg text-xs font-semibold flex items-center justify-center">!</span>
                        <span className="font-mono text-sm text-ios-ink">{status.error}</span>
                    </div>
                )}
                <EventList rows={rows} loading={status.loading}/>
            </main>
            <Footer/>
        </div>
    );
}

// ---------- Header ----------
function Header({ status }) {
    return (
        <header className="sticky top-0 z-10 bg-ios-bg/95 border-b border-ios-line/70">
            <div className="max-w-[1280px] mx-auto px-5 lg:px-8 py-4 flex items-center justify-between">
                <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-ios bg-gradient-to-br from-ios-blue to-ios-mint flex items-center justify-center shadow-ios">
                        <span className="text-ios-bg font-bold text-sm">V</span>
                    </div>
                    <div>
                        <div className="text-[15px] font-semibold tracking-tight text-ios-ink">Valkeyry</div>
                        <div className="text-[12px] text-ios-muted -mt-0.5">Audit Console</div>
                    </div>
                </div>
                <div data-testid="audit-last-fetched" className="text-[12px] text-ios-muted font-mono flex items-center gap-2">
                    <span className={`w-2 h-2 rounded-full ${status.loading ? 'bg-ios-orange animate-pulse' : status.lastFetched ? 'bg-ios-green' : 'bg-ios-muted/40'}`}/>
                    {status.loading ? 'syncing…' : status.lastFetched ? `synced ${status.lastFetched.toLocaleTimeString()}` : 'idle'}
                </div>
            </div>
        </header>
    );
}

function Footer() {
    return (
        <footer className="mt-10 py-5 border-t border-ios-line/70">
            <div className="max-w-[1280px] mx-auto px-5 lg:px-8 text-[12px] text-ios-muted flex justify-between">
                <span>Read-only · <span className="font-mono">/api/v1/tenants/{`{id}`}/audit</span></span>
                <span>append-only ledger · same payload as SIEM webhook</span>
            </div>
        </footer>
    );
}

// ---------- AuthCard ----------
function AuthCard({ auth, onConnect }) {
    const [d, setD] = useState(auth);
    useEffect(() => setD(auth), [auth.tenantId, auth.mode, auth.token]);
    return (
        <section data-testid="audit-auth-bar" className="bg-ios-card rounded-ios-lg p-5 shadow-ios grid gap-4 md:grid-cols-[1fr_240px_1fr_auto] md:items-end">
            <Field label="Tenant ID">
                <input data-testid="audit-tenant-input"
                       className="w-full bg-ios-bg rounded-ios px-4 py-2.5 text-[14px] focus:outline-none focus:ring-2 focus:ring-ios-blue/30 focus:bg-ios-surface transition"
                       value={d.tenantId} placeholder="acme-prod"
                       onChange={e => setD({ ...d, tenantId: e.target.value })}/>
            </Field>
            <Field label="Auth Mode">
                <div className="segmented w-full" data-testid="audit-auth-mode">
                    <button data-active={d.mode==='bearer'}    onClick={() => setD({ ...d, mode:'bearer' })}     className="flex-1 ios-press">OIDC</button>
                    <button data-active={d.mode==='apikey'}    onClick={() => setD({ ...d, mode:'apikey' })}     className="flex-1 ios-press">API Key</button>
                </div>
            </Field>
            <Field label={d.mode === 'bearer' ? 'JWT' : 'API Key'}>
                <input data-testid="audit-token-input" type="password"
                       className="w-full bg-ios-bg rounded-ios px-4 py-2.5 font-mono text-[13px] focus:outline-none focus:ring-2 focus:ring-ios-blue/30 focus:bg-ios-surface transition"
                       value={d.token} placeholder={d.mode==='bearer' ? 'eyJhbGciOi…' : 'plugin-test-key'}
                       onChange={e => setD({ ...d, token: e.target.value })}/>
            </Field>
            <button data-testid="audit-connect-btn" onClick={() => onConnect(d)}
                    className="px-6 py-2.5 bg-ios-blue text-ios-bg rounded-ios font-semibold text-[14px] shadow-ios ios-press hover:bg-emerald-400">
                Connect
            </button>
        </section>
    );
}

function Field({ label, children }) {
    return (
        <label className="grid gap-1.5">
            <span className="text-[11px] uppercase tracking-wider font-semibold text-ios-muted">{label}</span>
            {children}
        </label>
    );
}

// ---------- FilterCard ----------
function FilterCard({ filters, setFilters, onApply, busy, autoRefresh, setAutoRefresh }) {
    const u = (p) => setFilters({ ...filters, ...p });
    return (
        <section className="bg-ios-card rounded-ios-lg p-5 shadow-ios grid gap-4 md:grid-cols-[1fr_1fr_1fr_120px_auto_auto] md:items-end">
            <Field label="Table name">
                <input data-testid="audit-filter-table" className="w-full bg-ios-bg rounded-ios px-4 py-2.5 text-[14px] focus:outline-none focus:ring-2 focus:ring-ios-blue/30 focus:bg-ios-surface transition"
                       value={filters.tableName} onChange={e=>u({tableName:e.target.value})} placeholder="customers"/>
            </Field>
            <Field label="Record key">
                <input data-testid="audit-filter-record" className="w-full bg-ios-bg rounded-ios px-4 py-2.5 text-[14px] focus:outline-none focus:ring-2 focus:ring-ios-blue/30 focus:bg-ios-surface transition"
                       value={filters.recordKey} onChange={e=>u({recordKey:e.target.value})} placeholder="alice"/>
            </Field>
            <Field label="Actor">
                <input data-testid="audit-filter-actor" className="w-full bg-ios-bg rounded-ios px-4 py-2.5 text-[14px] focus:outline-none focus:ring-2 focus:ring-ios-blue/30 focus:bg-ios-surface transition"
                       value={filters.actor} onChange={e=>u({actor:e.target.value})} placeholder="build-bot"/>
            </Field>
            <Field label="Limit">
                <input data-testid="audit-filter-limit" type="number" min="1" max="500"
                       className="w-full bg-ios-bg rounded-ios px-4 py-2.5 text-[14px] focus:outline-none focus:ring-2 focus:ring-ios-blue/30 focus:bg-ios-surface transition"
                       value={filters.limit} onChange={e=>u({ limit: Math.max(1, Math.min(500, +e.target.value || 50)) })}/>
            </Field>
            <button data-testid="audit-refresh-btn" onClick={onApply} disabled={busy}
                    className="px-6 py-2.5 bg-ios-blue text-ios-bg rounded-ios font-semibold text-[14px] shadow-ios ios-press hover:bg-emerald-400 disabled:opacity-50 disabled:cursor-not-allowed">
                {busy ? 'Fetching…' : 'Refresh'}
            </button>
            <div className="flex items-center gap-2 self-center">
                <div data-testid="audit-autorefresh-toggle" data-on={autoRefresh}
                     onClick={() => setAutoRefresh(!autoRefresh)} className="ios-switch"/>
                <span className="text-[12px] text-ios-ink2">Auto · 5s</span>
            </div>
        </section>
    );
}

// ---------- EventList ----------
function EventList({ rows, loading }) {
    if (loading && rows.length === 0) {
        return <div data-testid="audit-loading" className="text-center py-10 text-ios-muted">
            <div className="inline-block w-6 h-6 border-2 border-ios-blue/30 border-t-ios-blue rounded-full animate-spin"/>
            <div className="mt-3 text-sm">loading audit events…</div>
        </div>;
    }
    if (rows.length === 0) {
        return (
            <div data-testid="audit-empty" className="bg-ios-card rounded-ios-lg p-12 shadow-ios text-center">
                <div className="w-14 h-14 mx-auto rounded-full bg-ios-bg flex items-center justify-center mb-3">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </div>
                <div className="text-[15px] text-ios-ink font-medium">No audit events</div>
                <div className="text-[13px] text-ios-muted mt-1">Try changing your filters or connect to a tenant.</div>
            </div>
        );
    }
    return (
        <ul className="grid gap-3" data-testid="audit-event-list">
            {rows.map(row => <EventRow key={row.id} row={row}/>)}
        </ul>
    );
}

function EventRow({ row }) {
    const [open, setOpen] = useState(false);
    const op = OP_BADGE[row.operation] || { bg:'#334155', fg:'#CBD5E1', label: row.operation };
    const tr = TRACK_BADGE[row.actorTrack] || { bg:'#334155', fg:'#CBD5E1' };
    const t = row.changedAt ? new Date(row.changedAt) : null;
    return (
        <li className="bg-ios-card rounded-ios-lg shadow-ios ios-lift" data-testid={`audit-event-${row.id}`}>
            <button data-testid={`audit-event-toggle-${row.id}`} onClick={() => setOpen(o=>!o)}
                    className="w-full text-left px-5 py-4 grid grid-cols-[auto_1fr_auto_24px] items-center gap-4">
                <div className="flex items-center gap-3 min-w-0">
                    <span className="px-2.5 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap" style={{ background: op.bg, color: op.fg }}>
                        {op.label}
                    </span>
                    <div className="min-w-0">
                        <div className="text-[14px] font-medium text-ios-ink truncate">
                            {row.tableName || '—'}
                            {row.recordKey && <span className="text-ios-muted"> · </span>}
                            {row.recordKey && <span className="text-ios-blue">{row.recordKey}</span>}
                        </div>
                        <div className="text-[12px] text-ios-muted mt-0.5">{t ? t.toLocaleString() : '—'}</div>
                    </div>
                </div>
                <span/>
                <div className="flex items-center gap-2">
                    <span className="px-2 py-0.5 rounded-full text-[10px] uppercase tracking-wider font-semibold" style={{ background: tr.bg, color: tr.fg }}>
                        {row.actorTrack}
                    </span>
                    <span className="font-mono text-[12px] text-ios-ink2">{row.actor}</span>
                </div>
                <span className="text-ios-muted text-[14px] transition-transform" style={{ transform: open ? 'rotate(90deg)' : 'none' }}>›</span>
            </button>
            {open && <DiffPanel before={row.beforeValue} after={row.afterValue} requestId={row.requestId}/>}
        </li>
    );
}

// ---------- Diff ----------
function DiffPanel({ before, after, requestId }) {
    const isCreate = before === null || before === undefined;
    return (
        <div className="border-t border-ios-line/70 px-5 pt-4 pb-5 grid gap-4" data-testid="audit-diff-panel">
            <div className="flex items-center justify-between text-[12px]">
                <span className="text-ios-muted">Request <span className="font-mono text-ios-blue">{requestId || '—'}</span></span>
                <span className="px-2.5 py-1 rounded-full text-[11px] font-medium" style={{ background: isCreate?'#064E3B':'#78350F', color: isCreate?'#6EE7B7':'#FCD34D' }}>
                    {isCreate ? 'New record' : 'Updated'}
                </span>
            </div>
            <div className="grid md:grid-cols-2 gap-3">
                <Side title="Before" payload={before} accent="#F43F5E" side="left"/>
                <Side title="After"  payload={after}  accent="#10B981" side="right"/>
            </div>
            <UnifiedDiff before={before} after={after}/>
        </div>
    );
}

function Side({ title, payload, accent, side }) {
    return (
        <div className="bg-ios-bg rounded-ios p-3">
            <div className="text-[10px] uppercase tracking-widest font-semibold mb-2 flex items-center gap-1.5" style={{ color: accent }}>
                <span className="w-1.5 h-1.5 rounded-full" style={{ background: accent }}/>
                {title}
            </div>
            <pre className="font-mono text-[12px] leading-relaxed whitespace-pre-wrap break-words text-ios-ink scrollbar"
                 style={{ maxHeight:'320px', overflow:'auto' }} data-testid={`audit-side-${side}`}>
{payload===null||payload===undefined ? '— (none)' : pretty(payload)}
            </pre>
        </div>
    );
}

function UnifiedDiff({ before, after }) {
    const lines = useMemo(() => diffJson(before??null, after??null), [before, after]);
    return (
        <details className="bg-ios-bg rounded-ios p-3" data-testid="audit-unified-diff">
            <summary className="text-[12px] text-ios-ink2 cursor-pointer select-none font-medium flex items-center gap-2">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#94A3B8" strokeWidth="2"><path d="m3 5 3 3 3-3"/></svg>
                Unified key-by-key diff
            </summary>
            <div className="font-mono text-[12px] leading-relaxed mt-3 scrollbar" style={{ maxHeight:'420px', overflow:'auto' }}>
                {lines.map((l, i) => <DiffLine key={i} line={l}/>)}
            </div>
        </details>
    );
}

function DiffLine({ line }) {
    const indent = '  '.repeat(line.depth);
    if (line.kind === 'equal')  return <div className="text-ios-muted">{indent}<span className="text-ios-blue">{leaf(line.path)}</span>: {pretty(line.value)}</div>;
    if (line.kind === 'open')   return <div className="text-ios-muted">{indent}{line.path ? <><span className="text-ios-blue">{leaf(line.path)}</span>: </> : null}{line.value}</div>;
    if (line.kind === 'close')  return <div className="text-ios-muted">{indent}{line.value}</div>;
    if (line.kind === 'add')    return <div className="text-ios-green" style={{ backgroundColor:'rgba(16,185,129,0.10)' }}>{indent}+ <span className="text-ios-blue">{leaf(line.path)}</span>: {pretty(line.after)}</div>;
    if (line.kind === 'remove') return <div className="text-ios-red"   style={{ backgroundColor:'rgba(244,63,94,0.10)' }}>{indent}− <span className="text-ios-blue">{leaf(line.path)}</span>: {pretty(line.before)}</div>;
    if (line.kind === 'change') return (
        <div className="grid gap-0.5">
            <div className="text-ios-red"   style={{ backgroundColor:'rgba(244,63,94,0.10)' }}>{indent}− <span className="text-ios-blue">{leaf(line.path)}</span>: {pretty(line.before)}</div>
            <div className="text-ios-green" style={{ backgroundColor:'rgba(16,185,129,0.10)' }}>{indent}+ <span className="text-ios-blue">{leaf(line.path)}</span>: {pretty(line.after)}</div>
        </div>
    );
    return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
