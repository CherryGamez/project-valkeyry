spring:
  application:
    name: valkeyry-ipaas
  main:
    web-application-type: reactive
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/ipaas}
    username: ${R2DBC_USER:ipaas}
    password: ${R2DBC_PASSWORD:ipaas}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
  flyway:
    enabled: true
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/ipaas}
    user: ${R2DBC_USER:ipaas}
    password: ${R2DBC_PASSWORD:ipaas}
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16
  cloud:
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      token: ${VAULT_TOKEN:dev-root-token}
      kv:
        enabled: true
        backend: secret
  security:
    oauth2:
      resourceserver:
        jwt:
          # Generic OIDC issuer placeholder – override per environment (Keycloak / Auth0 / Okta / Cognito ...).
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080/realms/ipaas}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
# ============ iPaaS Platform Configuration ============
ipaas:
  # 'QUEUE' = transactional worker pool with manual ack; 'STREAMING' = log-based consumer groups with offset replay.
  processing-mode: ${PROCESSING_MODE:QUEUE}
  default-broker: ${DEFAULT_BROKER:RABBITMQ}    # RABBITMQ | KAFKA | ACTIVEMQ
  rate-limit:
    capacity: 100
    refill-tokens: 100
    refill-period-seconds: 60
  idempotency:
    ttl-seconds: 86400
  retention:
    cron: "0 0 0 * * *"   # midnight
    default-days: 30
  ai:
    enabled: ${AI_ENABLED:false}
    mode: ${AI_MODE:ENRICH}                 # ENRICH | DECIDE | OFF
    bridge-url: ${AI_BRIDGE_URL:http://localhost:8090}
    provider: ${AI_PROVIDER:openai}          # openai | anthropic | gemini
    model: ${AI_MODEL:gpt-4.1-mini}
    system-prompt: "You are a JSON enrichment assistant. Return ONLY a JSON object."
    routing-options: "primary,secondary,dlq"
    max-payload-bytes: 32000
    timeout-seconds: 20
  security:
    allow-anonymous: ${ALLOW_ANONYMOUS:false}
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:3000}
  vault:
    renewal-enabled: ${VAULT_RENEW:true}
    renewal-interval-ms: ${VAULT_RENEW_MS:1800000}
    renewal-increment-seconds: 3600
  brokers:
    rabbitmq:
      host: ${RABBIT_HOST:localhost}
      port: ${RABBIT_PORT:5672}
      username: ${RABBIT_USER:guest}
      password: ${RABBIT_PASSWORD:guest}
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    activemq:
      broker-url: ${ACTIVEMQ_URL:tcp://localhost:61616}
      username: ${ACTIVEMQ_USER:admin}
      password: ${ACTIVEMQ_PASSWORD:admin}
  webhook:
    admin-alert-url: ${ADMIN_ALERT_WEBHOOK:http://localhost:9999/admin/alerts}

resilience4j:
  circuitbreaker:
    instances:
      outboundWebhook:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      outboundWebhook:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-},spanId=%X{spanId:-}]"
  level:
    io.valkeyry: DEBUG
    reactor.netty: INFO
